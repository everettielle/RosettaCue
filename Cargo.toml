[workspace]
members = [
  "apps/backend",
  "apps/cli",
  "crates/bluray",
  "crates/core",
  "crates/domain",
  "crates/export",
  "crates/llm",
  "crates/ocr",
  "crates/pgs",
  "crates/project",
  "crates/translation",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
