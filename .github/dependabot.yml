version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      renderer:
        patterns:
          - "react*"
          - "@types/react*"
          - "tailwind*"
          - "@tailwindcss/*"
          - "lucide-react"
          - "@base-ui/*"
      tooling:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript*"
          - "prettier*"
          - "vite*"
          - "@vitejs/*"
          - "vitest"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
