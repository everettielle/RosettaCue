name: Bug report
description: Something in RosettaCue behaves incorrectly
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not report security vulnerabilities
        here — see [SECURITY.md](https://github.com/everettielle/RosettaCue/blob/main/SECURITY.md).

        For subtitle recognition quality specifically, use the
        "OCR quality" template instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a project in ...
        2. Attach source ...
        3. Extract track ...
        4. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Welcome / project management
        - Blu-ray source analysis
        - PGS extraction
        - OCR
        - Editor / Inspector
        - Preview rendering
        - Review workflow
        - Translation
        - Export
        - Settings / provider configuration
        - Packaging / installation
        - CLI
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: RosettaCue version or commit
      placeholder: "0.3.0, or the commit SHA you built from"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version and CPU architecture
      placeholder: "macOS 27.0, arm64"

  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options:
        - Packaged build
        - From source (pnpm dev)
        - CLI only
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider and model
      description: Only if the issue involves OCR, validation, or translation.
      placeholder: "LM Studio / gemma-4-31b-it"

  - type: textarea
    id: logs
    attributes:
      label: Errors and logs
      description: >
        Any error shown in the app, plus sidecar stderr output if you ran from
        source. This is automatically formatted as code.
      render: shell

  - type: textarea
    id: diagnostics
    attributes:
      label: Media tool diagnostics
      description: >
        Output of `cargo run -p rosettacue-cli -- doctor`, or a screenshot of
        Settings → General. Required for extraction and source analysis issues.
      render: json
