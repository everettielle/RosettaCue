blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/everettielle/RosettaCue/security/advisories/new
    about: Report privately through a GitHub Security Advisory. Never in a public issue.
  - name: Questions and ideas
    url: https://github.com/everettielle/RosettaCue/discussions
    about: Ask how something works, or float an idea before filing a feature request.
  - name: Media tool problems
    url: https://github.com/everettielle/RosettaCue/blob/main/README.md#media-tools
    about: >-
      "Tool not found" errors usually mean bd_list_titles, bd_splice, or ffmpeg
      is missing. Check the setup notes and `rosettacue doctor` first.
