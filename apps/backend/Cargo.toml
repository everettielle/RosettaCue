[package]
name = "rosettacue-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "rosettacue-backend"
path = "src/main.rs"

[dependencies]
rosettacue-core = { path = "../../crates/core" }
rosettacue-domain = { path = "../../crates/domain" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24.0", features = ["serde"] }

[lints]
workspace = true
